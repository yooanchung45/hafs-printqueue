name: Deploy to rpi

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest and deploy
        run: |
          cd /srv/printqueue
          git fetch origin main
          git reset --hard "$GITHUB_SHA"
          chmod +x deploy.sh
          ./deploy.sh
