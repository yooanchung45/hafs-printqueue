services:
  backend:
    build:
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      SLACK_NOTIFICATIONS_ENABLED: "false"

  frontend:
    build:
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      API_ORIGIN: http://backend:8000
      NODE_ENV: development
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
