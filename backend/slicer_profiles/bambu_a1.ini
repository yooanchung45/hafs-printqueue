[printer]
bed_shape                   = 0x0,256x0,256x256,0x256
max_print_height            = 256
nozzle_diameter             = 0.4
printer_technology          = FFF
use_relative_e_distances    = 1
remaining_times             = 1

; These are intentionally blank — bambu_postprocess.py injects the real
; Bambu A1 machine start/end sequences at runtime.
start_gcode                 =
end_gcode                   =
before_layer_gcode          =
layer_gcode                 =
toolchange_gcode            =

; Retraction — 0.8mm at 45mm/s is safe for PLA on the A1's direct drive.
; Increase retract_speed to 60 if you see stringing on fine details.
retract_length              = 0.8
retract_speed               = 45

; Z-hop on every retraction move — 0.2 wasn't enough clearance and the nozzle
; would catch/graze raised features (most often a corner that lifted slightly
; off the bed from weak first-layer adhesion) during travel. 0.4 gives more
; margin. If you still see dragging, raise further; it only costs travel time.
retract_lift                = 0.4


[print]

; ── FIRST LAYER SQUISH ───────────────────────────────────────────────────────
; Symptom this fixes: first layer comes out as round, poorly-bonded strands
; that peel up off the bed almost like a raft, instead of fusing flat. That's
; classic under-squish — not enough gap compression between nozzle and bed on
; layer 1 — and it cascades: a corner that isn't stuck lifts as printing
; continues, and the nozzle then grazes/bumps into that lifted corner on a
; later pass (the "nozzle is too low, it's hitting the print" symptom is
; usually this, not a Z-calibration problem — the A1 re-homes Z via its own
; strain-gauge contact probe every print, so gcode Z isn't what's off here).
;
; first_layer_height thinner than the normal layer_height (0.2, set via
; --layer-height at slice time) forces more filament to be pressed into a
; shorter layer = more squish = better bed fusion.
; first_layer_extrusion_width wider than the 0.4mm nozzle flattens the line
; further for the same reason.
first_layer_height          = 0.16
first_layer_extrusion_width = 0.45

; ── ACCELERATIONS (mm/s²) ────────────────────────────────────────────────────
; PrusaSlicer emits M204 commands in the gcode body using these values.
; They override the machine-level M204 P12000 set in the Bambu start gcode
; for their respective move types, so the printer uses these mid-print.
;
; The Bambu A1 machine ceiling is 12000 mm/s² (set in start gcode M201/M204).
; We stay well below that — high accel on a bedslinger causes the Y axis
; (moving bed) to vibrate and leave ringing artifacts on the print surface.
;
; Rule of thumb:
;   outer wall → lowest accel (it's what you see)
;   inner wall → moderate
;   infill     → high (hidden, nobody cares)
;   first layer → very low (adhesion is everything)
;   bridge     → low (unsupported, needs controlled flow)

default_acceleration        = 7000   ; catch-all fallback (was 5000)
perimeter_acceleration      = 5000   ; both outer and inner walls (was 3000 —
                                      ; raised so the higher wall speeds below
                                      ; are actually reached on shorter segments)
infill_acceleration         = 9000   ; rectilinear infill (see fill-pattern
                                      ; in slicer.py) is straight back-and-forth
                                      ; lines with far fewer direction changes
                                      ; than gyroid's curves, so it tolerates
                                      ; more accel without ringing (was 8000)
bridge_acceleration         = 2000   ; bridges are unsupported — keep gentle
first_layer_acceleration    = 1000   ; first layer: slow and controlled


; ── SPEEDS (mm/s) ────────────────────────────────────────────────────────────
; Target: match a stock Bambu A1 "0.20mm Standard" run once past the first
; layer (~200 outer / 300 inner / 250 solid / 200 top / 500 travel). The real
; ceiling is melt flow, not these numbers — max_volumetric_speed below caps
; anything that would out-run the hotend, so we can set the per-feature speeds
; aggressively and let the slicer throttle where it has to.

; Hard flow limit for a 0.4 nozzle on the A1 with PLA (Bambu's own PLA Basic
; profile uses ~21). Set to PETG ~13 / ABS ~16 if you change filament.
max_volumetric_speed        = 21

; Walls
external_perimeter_speed    = 200    ; outer wall  (was 180)
perimeter_speed             = 300    ; inner walls (was 280)

; Infill
infill_speed                = 350    ; sparse infill (buried — leave fast)
solid_infill_speed          = 250    ; solid layers — floors/ceilings (was 230)
top_solid_infill_speed      = 200    ; top surface, visible (was 140)

; First layer — never touch this, adhesion beats everything
first_layer_speed           = 30

; Support and bridges
support_material_speed      = 250    ; supports (was 200)
bridge_speed                = 60     ; bridges over air — keep gentle
gap_fill_speed              = 80     ; thin gaps between walls

; Travel — non-printing moves, go fast, no quality impact
travel_speed                = 500    ; machine ceiling (was 450)